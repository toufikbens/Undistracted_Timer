<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08090c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Undistracted Timer">
    <title>Undistracted Timer</title>

    <!-- App manifest and icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/favicon.png?v=3" type="image/png" sizes="512x512">
    <link rel="shortcut icon" href="assets/favicon.png?v=3" type="image/png">
    <link rel="icon" href="assets/favicon.png?v=3" type="image/png">
    <link rel="apple-touch-icon" href="assets/favicon.png?v=3">

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isTauri = params.get("runtime") === "tauri" || Boolean(window.__TAURI_INTERNALS__ || window.__TAURI__);

        if (isTauri) {
          document.documentElement.dataset.runtime = "tauri";
        }
      })();
    </script>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css?v=9">
  </head>
  <body>
    <!-- App shell -->
    <main class="shell" aria-label="Undistracted Timer">
      <!-- Top bar: app identity, appearance, and timer status -->
      <header class="titlebar" data-tauri-drag-region>
        <div class="traffic-lights" aria-hidden="true">
          <span class="light light-close"></span>
          <span class="light light-minimize"></span>
          <span class="light light-maximize"></span>
        </div>
        <div class="brand">
          <div>
            <p class="eyebrow">Pomodoro Timer</p>
            <h1>Undistracted Timer</h1>
          </div>
        </div>
        <div class="title-actions">
          <button class="theme-button web-only" id="webAmbientButton" type="button" aria-label="Ambient Sounds">
            <span>Ambient Sounds</span>
          </button>
          <button class="theme-button web-only" id="webAppearanceButton" type="button" aria-label="Appearance">
            <span>Appearance</span>
          </button>
          <button class="theme-button web-only" id="webSettingsButton" type="button" aria-label="Settings">
            <span>Settings</span>
          </button>
          <p class="status-pill" id="statusText" aria-live="polite">Ready</p>
        </div>
      </header>

      <!-- Main timer and settings layout -->
      <section class="timer-layout">
        <!-- Timer stage: modes, countdown ring, controls, and cycle progress -->
        <div class="timer-stage" aria-label="Current timer">
          <div class="mode-tabs" role="tablist" aria-label="Timer mode">
            <button class="mode-tab is-active" type="button" role="tab" aria-selected="true" data-mode="focus">Focus</button>
            <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="short">Short break</button>
            <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="long">Long break</button>
          </div>

          <div class="ring-wrap" aria-live="polite">
            <svg class="progress-ring" viewBox="0 0 240 240" role="img" aria-labelledby="timerLabel timerTime">
              <title id="timerLabel">Time remaining</title>
              <circle class="ring-track" cx="120" cy="120" r="104" pathLength="1"></circle>
              <circle class="ring-progress" cx="120" cy="120" r="104" pathLength="1"></circle>
            </svg>
            <div class="time-readout">
              <p id="modeLabel">Focus</p>
              <strong id="timerTime">25:00</strong>
              <span id="nextLabel">Next: short break</span>
            </div>
          </div>

          <div class="cycle-progress" aria-label="Session cycle progress">
            <div class="cycle-progress-bar">
              <div class="cycle-progress-fill" id="cycleProgressFill"></div>
            </div>
            <span class="cycle-progress-text" id="cycleProgressText">0 / 4 sessions</span>
          </div>

          <div class="controls" aria-label="Timer controls">
            <button class="control-button primary" id="startPauseButton" type="button">Start</button>
            <button class="control-button" id="resetButton" type="button">Reset</button>
            <button class="control-button" id="skipButton" type="button">Skip</button>
          </div>

          <div class="session-row" aria-label="Focus cycle progress">
            <span class="cycle-dot is-current"></span>
            <span class="cycle-dot"></span>
            <span class="cycle-dot"></span>
            <span class="cycle-dot"></span>
          </div>
        </div>

        <!-- Side panel: daily stats, timer settings, and preferences -->
        <aside class="side-panel" aria-label="Focus details and preferences">
          <section class="ambient-summary" aria-label="Ambient Sounds">
            <div>
              <span>Ambient Sounds</span>
              <strong id="ambientLabel">Off</strong>
            </div>
            <button class="utility-button ambient-manage" id="ambientManageButton" type="button">Manage</button>
          </section>

          <section class="panel" aria-label="Today's focus">
            <div>
              <p class="metric-label">Today</p>
              <strong id="todayMetric">0 focus sessions</strong>
            </div>
            <div>
              <p class="metric-label">Focus time</p>
              <strong id="minutesMetric">0 min</strong>
            </div>
            <button class="utility-button subtle" id="clearStatsButton" type="button">Clear focus stats</button>
          </section>

          <!-- Duration settings -->
          <section class="panel settings" aria-label="Timer settings">
            <div class="setting-row">
              <label for="focusMinutes">Focus</label>
              <input id="focusMinutes" type="number" min="1" max="180" step="1" inputmode="numeric">
            </div>
            <div class="setting-row">
              <label for="shortMinutes">Short break</label>
              <input id="shortMinutes" type="number" min="1" max="90" step="1" inputmode="numeric">
            </div>
            <div class="setting-row">
              <label for="longMinutes">Long break</label>
              <input id="longMinutes" type="number" min="1" max="120" step="1" inputmode="numeric">
            </div>
            <div class="setting-row">
              <label for="longEvery">Long break every</label>
              <input id="longEvery" type="number" min="2" max="12" step="1" inputmode="numeric">
            </div>
          </section>

          <!-- Behavior preferences -->
          <section class="panel preferences" aria-label="Preferences">
            <label class="toggle-row">
              <span>Auto-start next session</span>
              <input id="autoStartToggle" type="checkbox">
            </label>
            <label class="toggle-row">
              <span>Completion chime</span>
              <input id="soundToggle" type="checkbox">
            </label>
            <button class="utility-button" id="notifyButton" type="button">Enable notifications</button>
          </section>
        </aside>
      </section>
    </main>

    <div class="ambient-overlay" id="ambientOverlay" hidden>
      <section class="ambient-window" role="dialog" aria-modal="true" aria-labelledby="ambientDialogTitle">
        <header class="ambient-window-header">
          <div>
            <p class="metric-label">Ambient Sounds</p>
            <h2 id="ambientDialogTitle">Ambient mix</h2>
          </div>
          <button class="utility-button ambient-close" id="ambientCloseButton" type="button">Close</button>
        </header>

        <div class="ambient-library" id="ambientLibrary" role="group" aria-label="Ambient Sounds"></div>

        <div class="ambient-window-footer">
          <label class="volume-row">
            <span>Global volume <strong id="ambientVolumeValue">42%</strong></span>
            <input id="ambientVolume" type="range" min="0" max="100" step="1" value="42">
          </label>
          <button class="utility-button ambient-toggle" id="ambientToggleButton" type="button" aria-pressed="false">Play</button>
        </div>
      </section>
    </div>

    <div class="web-appearance-overlay" id="webAppearanceOverlay" hidden>
      <section class="web-appearance-window" role="dialog" aria-modal="true" aria-labelledby="webAppearanceTitle">
        <header class="web-appearance-header">
          <h2 id="webAppearanceTitle">Background</h2>
          <button class="utility-button" id="webAppearanceCloseButton" type="button">Close</button>
        </header>
        <div class="web-appearance-grid" id="webAppearanceGrid"></div>
        <input type="file" id="webAppearanceFileInput" accept="image/*" multiple hidden>
        <div class="web-appearance-controls">
          <label class="web-appearance-slider">
            <span>Opacity <strong id="webOpacityValue">72%</strong></span>
            <input id="webOpacitySlider" type="range" min="0" max="100" step="1" value="72">
          </label>
          <label class="web-appearance-slider">
            <span>Glass blur <strong id="webBlurValue">14px</strong></span>
            <input id="webBlurSlider" type="range" min="0" max="30" step="1" value="14">
          </label>
        </div>
      </section>
    </div>

    <div class="web-settings-overlay" id="webSettingsOverlay" hidden>
      <section class="web-settings-window" role="dialog" aria-modal="true" aria-labelledby="webSettingsTitle">
        <header class="web-settings-header">
          <h2 id="webSettingsTitle">Settings</h2>
          <button class="utility-button" id="webSettingsCloseButton" type="button">Close</button>
        </header>
        <div class="web-settings-content">
          <section class="panel" aria-label="Timer durations">
            <p class="metric-label">Timer durations</p>
            <div class="setting-row">
              <label for="webFocusMinutes">Focus</label>
              <input id="webFocusMinutes" type="number" min="1" max="180" step="1" inputmode="numeric">
            </div>
            <div class="setting-row">
              <label for="webShortMinutes">Short break</label>
              <input id="webShortMinutes" type="number" min="1" max="90" step="1" inputmode="numeric">
            </div>
            <div class="setting-row">
              <label for="webLongMinutes">Long break</label>
              <input id="webLongMinutes" type="number" min="1" max="120" step="1" inputmode="numeric">
            </div>
            <div class="setting-row">
              <label for="webLongEvery">Long break every</label>
              <input id="webLongEvery" type="number" min="2" max="12" step="1" inputmode="numeric">
            </div>
          </section>
          <section class="panel" aria-label="Preferences">
            <p class="metric-label">Preferences</p>
            <label class="toggle-row">
              <span>Auto-start next session</span>
              <input id="webAutoStartToggle" type="checkbox">
            </label>
            <label class="toggle-row">
              <span>Completion chime</span>
              <input id="webSoundToggle" type="checkbox">
            </label>
            <button class="utility-button" id="webNotifyButton" type="button">Enable notifications</button>
          </section>
          <section class="panel" aria-label="Stats">
            <p class="metric-label">Today</p>
            <strong id="webTodayMetric">0 focus sessions</strong>
            <p class="metric-label">Focus time</p>
            <strong id="webMinutesMetric">0 min</strong>
            <button class="utility-button subtle" id="webClearStatsButton" type="button">Clear focus stats</button>
          </section>
        </div>
      </section>
    </div>

    <script src="app.js?v=6" defer></script>
  </body>
</html>
